<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal do Aprendiz · CSC Frísia</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Cores do Manual de Identidade Visual Frísia (2021): azul #003475 e #2581c4, verde #b1c800, azul claro #85cee4 */
:root{--bg:#f1f5f9;--surface:#fff;--ink:#14233a;--muted:#546579;--line:#d3dce6;--brand:#003475;--brand-soft:#e1ecf7;--on-brand:#fff;--lime:#b1c800;--ok:#2581c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1626;--surface:#112238;--ink:#eaf1f8;--muted:#9fb3c8;--line:#233a55;--brand:#85cee4;--brand-soft:#16304e;--on-brand:#06223f;--ok:#85cee4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1626;--surface:#112238;--ink:#eaf1f8;--muted:#9fb3c8;--line:#233a55;--brand:#85cee4;--brand-soft:#16304e;--on-brand:#06223f;--ok:#85cee4;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header{background:#003475;color:#fff;border-bottom:6px solid var(--lime)}
header .wrap{padding-top:26px;padding-bottom:24px}
.brand{font:700 18px Montserrat,system-ui,sans-serif;letter-spacing:.04em;margin-bottom:10px}
.brand b{color:var(--lime)}
h1{font:700 clamp(28px,5.5vw,42px)/1.1 Montserrat,system-ui,sans-serif;margin:0 0 8px}
header p{margin:0;max-width:58ch;color:#d6e6f5}
.prog{margin-top:18px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px}
.bar{flex:1;max-width:320px;height:10px;background:rgba(255,255,255,.28);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lime);transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 8px;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
button,input{font:inherit;color:inherit}
.tab{border:1.5px solid var(--line);background:var(--surface);padding:7px 16px;border-radius:6px;cursor:pointer;font-weight:600}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
input[type=search]{flex:1;min-width:180px;padding:8px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface)}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.cats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.chip{border:0;background:transparent;color:var(--brand);cursor:pointer;padding:2px 0;font-weight:600;border-bottom:3px solid transparent}
.chip[aria-pressed="true"]{border-bottom-color:var(--lime)}
.list{display:grid;gap:12px;padding-bottom:48px}
.item{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:6px}
.item.it{border-left-color:var(--lime)}
.item.done{opacity:.72}
.row{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;flex-wrap:wrap}
.main{flex:1;min-width:220px}
.kind{display:inline-block;font-weight:700;font-size:13px;padding:1px 8px;border-radius:4px;background:var(--brand);color:var(--on-brand);margin-right:8px}
.it .kind{background:var(--lime);color:#1d2600}
.meta{color:var(--muted);font-size:14px}
h2{font:600 19px/1.25 Montserrat,system-ui,sans-serif;margin:6px 0 4px}
.act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--brand);background:var(--brand);color:var(--on-brand);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--brand)}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ok)}
.detail{border-top:1px dashed var(--line);padding:14px 16px 16px;display:none}
.item.open .detail{display:block}
.detail h3{font:600 15px Montserrat,system-ui,sans-serif;margin:12px 0 4px}
.detail h3:first-child{margin-top:0}
.detail ol,.detail ul{margin:0;padding-left:22px}
.detail li{margin:3px 0}
.alert{background:color-mix(in srgb,var(--lime) 22%,transparent);border-left:4px solid var(--lime);padding:8px 12px;border-radius:4px}
.empty{padding:32px;text-align:center;color:var(--muted)}
footer{padding:0 20px 28px;text-align:center;color:var(--muted);font-size:13px}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding-top:18px}
.nav button{border:0;background:transparent;font-weight:600;padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
.nav button[aria-current="true"]{color:var(--brand);border-bottom-color:var(--lime)}
.ev{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--lime);border-radius:6px;padding:12px 16px}
.ev .d{min-width:56px;text-align:center;font-weight:700;font-size:22px;color:var(--brand);line-height:1.1}
.ev .d small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:6px}
summary{cursor:pointer;padding:12px 16px;font-weight:600}
details p{margin:0;padding:0 16px 14px;color:var(--muted)}
[hidden]{display:none!important}
.detail p{margin:6px 0}
.chkl{display:grid;gap:8px;margin:6px 0}
.chkl .chk{align-items:flex-start;font-size:16px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="brand">FRÍSIA <b>·</b> CSC</div>
<h1>Portal do Aprendiz</h1>
<p>Vídeos e instruções de trabalho (ITs) da Central de Serviços Compartilhados. Assista, leia e marque o que já concluiu.</p>
<div class="prog"><span id="ptxt">0 de 0 concluídos</span><div class="bar" role="progressbar" aria-label="Progresso"><i id="pbar"></i></div></div>
</div></header>

<main class="wrap">
<nav class="nav" id="nav" aria-label="Seções">
<button data-s="trein" aria-current="true">Treinamentos</button>
<button data-s="eventos" aria-current="false">Eventos</button>
<button data-s="faq" aria-current="false">Dúvidas frequentes</button>
</nav>
<section id="s-trein">
<div class="tools">
<div class="tabs" id="tabs">
<button class="tab" data-k="all" aria-pressed="true">Tudo</button>
<button class="tab" data-k="video" aria-pressed="false">Vídeos</button>
<button class="tab" data-k="it" aria-pressed="false">ITs</button>
</div>
<input type="search" id="q" placeholder="Buscar por título ou palavra" aria-label="Buscar">
</div>
<div class="cats" id="cats"></div>
<div class="list" id="list"></div>
</section>
<section id="s-eventos" hidden style="padding-top:20px"></section>
<section id="s-faq" hidden style="padding:20px 0 48px"></section>
</main>
<footer>Seu progresso fica salvo neste navegador.<br>Apoio ao Aprendiz | Frísia Cooperativa Agroindustrial</footer>

 {id:"it1",tipo:"it",cat:"Fiscal",titulo:"Lançamento de notas — Frísia Facilita",rev:"Diariamente · Frísia Facilita e EBS",

  {t:"Como iniciar a atividade",ol:["Acesse o Frísia Facilita.","Localize os protocolos do tipo CEN003, que identificam as solicitações tratadas neste processo.","Localize o protocolo referente à nota fiscal que será conferida.","Identifique o número da nota fiscal e a ordem de compra informados no protocolo."],al:"CEN003 é o tipo de protocolo no Frísia Facilita. O caminho exato do filtro para encontrá-los ainda será confirmado."},

  {t:"Etapa 2 — Conferência da ordem de compra",p:"Acesse a ordem de compra no sistema correspondente, compare com os dados da nota e verifique:",ul:[["CNPJ do fornecedor","confirme se está correto e é o fornecedor da nota"],["Código de serviço","deve corresponder ao informado na OC"],["Organização","a OC deve pertencer à organização correta"],["Valores","devem estar de acordo com a OC"],["Saldo disponível","deve ser suficiente para o lançamento"],["Situação da OC","deve estar aberta"]],al:"Se a OC estiver fechada ou sem saldo suficiente, não abra o protocolo para lançamento no Fiscal. Avise o responsável pelo processo para receber as orientações.",p2:"Não prossiga enquanto houver divergências que impeçam a continuidade do procedimento."},
  {t:"Etapa 3 — Abertura do protocolo para lançamento no Fiscal",p:"Com nota e OC conferidas, e a OC aberta e com saldo, acesse o Frísia Facilita e abra o protocolo de lançamento no setor Fiscal. Preencha todos os campos com as informações conferidas:",ul:["Valor total da nota fiscal","CNPJ do fornecedor","CNPJ da Frísia","Valor total da ordem de compra","Saldo disponível na ordem de compra","Situação da ordem de compra","Data de vencimento da nota fiscal","Número da ordem de compra","Organização da ordem de compra"],p2:"Confira atentamente cada campo antes de prosseguir."},
  {t:"Etapa 4 — Salvar e encaminhar o protocolo",ol:["Revise todas as informações preenchidas.","Confirme se os dados correspondem à nota fiscal e à ordem de compra.","Salve o protocolo.","Encaminhe-o ao setor Fiscal, conforme o fluxo do Frísia Facilita."],p2:"Encaminhe somente depois de conferir as informações."},
  {t:"Cuidados importantes",ul:["Confira se o número da nota informado no protocolo é o mesmo da nota.","Verifique se a ordem de compra corresponde à nota fiscal.","Confirme o CNPJ do fornecedor e o CNPJ da Frísia.","Verifique se o código de serviço está correto.","Confirme se a OC pertence à organização indicada.","Confira os valores e o saldo disponível.","Verifique se a OC está aberta.","Confira a data de vencimento da nota fiscal.","Não abra o protocolo de lançamento se a OC estiver fechada ou sem saldo suficiente.","Não encaminhe protocolos com informações divergentes ou não verificadas."],p2:"A conferência correta evita devoluções, retrabalho e atrasos no lançamento fiscal."},
  {t:"Divergências possíveis",ul:["Número da nota fiscal incorreto no protocolo","Ordem de compra incompatível com a nota","Código de serviço divergente","CNPJ ou organização incorretos","Valor ou saldo incompatível com o lançamento"]},
  {t:"Divergência identificada antes do encaminhamento",p:"Não prossiga como se as informações estivessem corretas. Procure o responsável pelo processo para receber orientação sobre a regularização.",p2:"Se a OC estiver fechada ou sem saldo suficiente, não abra o protocolo e avise o responsável."},
  {t:"Quando o Fiscal devolver o protocolo",ol:["Leia o retorno do Fiscal e identifique o problema apontado.","Confira novamente as informações da nota fiscal e da ordem de compra.","Se o problema estiver na OC, como o código de serviço, peça ao responsável pela OC que providencie o ajuste.","Aguarde a aprovação da OC ajustada.","Com a OC aprovada, devolva o protocolo ao Fiscal, seguindo o fluxo do Frísia Facilita."],al:"Não considere uma alteração concluída antes da aprovação da OC, quando essa aprovação for necessária para a regularização.",p2:"Se não souber como tratar a divergência ou qual é a correção necessária, procure um dos responsáveis pelo apoio antes de prosseguir."},
  {t:"Responsáveis pelo apoio",p:"Em caso de dúvidas sobre a conferência da nota, da OC ou das divergências, procure:",ul:["Letícia (Baby)","Raphael","Yasmin"],p2:"Procure apoio também quando algo impedir a continuidade do processo ou quando não estiver claro como regularizar uma divergência."},
  {t:"Checklist de conferência",p:"Antes de encaminhar o protocolo ao Fiscal, confirme:",chk:["Localizei o protocolo do tipo CEN003 no Frísia Facilita.","Conferi o número da nota fiscal.","Abri e conferi a nota fiscal.","Conferi a ordem de compra no sistema correspondente.","Verifiquei o CNPJ do fornecedor.","Verifiquei o CNPJ da Frísia.","Conferi o código de serviço.","Confirmei a organização da ordem de compra.","Conferi o valor total da nota fiscal.","Conferi o valor total e o saldo da ordem de compra.","Confirmei que a ordem de compra está aberta.","Verifiquei a data de vencimento da nota fiscal.","Preenchi todos os campos solicitados no protocolo.","Revisei os dados antes de salvar.","Salvei e encaminhei o protocolo ao setor Fiscal."],al:"Se a OC estiver fechada, sem saldo suficiente ou com divergência que impeça o lançamento, interrompa o procedimento e avise o responsável."},
  {t:"Informações em validação",p:"Ainda serão confirmados:",ol:["Em qual sistema a nota fiscal e a ordem de compra são consultadas em cada etapa.","O caminho exato no Frísia Facilita para localizar os protocolos CEN003.","O caminho e o nome da opção para abrir o protocolo de lançamento no Fiscal.","Os nomes exatos dos campos do formulário.","O comando ou opção para devolver o protocolo ao Fiscal após a aprovação da OC."],p2:"Esses detalhes poderão ser acrescentados depois com capturas de tela ou vídeo demonstrativo."}
  ]},
 {id:"it2",tipo:"it",cat:"Despesas",titulo:"Reembolso de despesas — Facilita e EBS",rev:"Sob demanda · Frísia Facilita e EBS",

  secoes:[
  {t:"1. Acessar e assumir o protocolo no Facilita",ol:["Acesse o Frísia Facilita.","Localize um protocolo do tipo Reembolso de Despesa.","Clique em “Atribuir solicitação” para assumir o atendimento."]},
  {t:"2. Analisar a solicitação e os anexos",ol:["Leia todas as informações preenchidas no protocolo.","Confira a justificativa apresentada pelo solicitante.","Abra e analise todos os anexos disponibilizados no protocolo.","Identifique as despesas que deverão ser lançadas no EBS.","Se houver dúvida sobre a classificação de alguma despesa, consulte um colega antes de prosseguir."]},
  {t:"3. Verificar a autorização no EBS",ol:["Acesse o EBS.","Navegue até OIE Reembolso de Despesas → Autorizações.","Procure o nome do colaborador que solicitou o reembolso.","Verifique se o nome aparece na lista de autorizações."],al:"Só prossiga com a criação do relatório quando a autorização estiver disponível."},
  {t:"Se o colaborador não aparecer na lista",ol:["Retorne ao protocolo no Facilita.","Registre a observação: “Por gentileza, liberar o acesso para realizar o reembolso”.","Devolva o protocolo ao solicitante.","Aguarde até que o solicitante libere o acesso e devolva o protocolo no Facilita.","Após o retorno, consulte novamente a lista de autorizações no EBS."]},
  {t:"4. Criar o relatório de reembolso",ol:["No EBS, acesse OIE Reembolso de Despesas → Criar Relatório.","Selecione o nome do colaborador solicitante na lista.","Não altere os outros campos da tela inicial.","No campo de justificativa do relatório, copie exatamente o texto da justificativa registrada no protocolo do Facilita."]},
  {t:"5. Lançar as despesas",ol:["Consulte os comprovantes anexados ao protocolo para identificar as despesas.","No EBS, selecione, na lista de tipos de despesa, a categoria que melhor corresponde a cada gasto.","Para cada despesa, preencha uma linha própria (Data, Valor e Justificativa).","Repita o procedimento para todas as despesas do protocolo."],ul:[["Data","conforme o comprovante"],["Valor","conforme o comprovante"],["Justificativa","conforme as informações da despesa e as orientações do processo"]],al:"Se não souber qual tipo de despesa selecionar, consulte um colega em vez de escolher por suposição."},
  {t:"5.1 Classificação de alimentação",p:"Para despesas com refeições, use o horário de emissão do comprovante como referência:",ul:[["Almoço","entre 11h e 14h"],["Jantar","entre 19h e 22h"],["Fora desses horários","escolha a opção mais próxima, conforme a orientação recebida"]],p2:"Se o comprovante incluir uma refeição e uma bebida, como refrigerante em lata, considere o gasto como uma refeição e classifique-o de acordo com o horário de emissão."},
  {t:"5.2 Preenchimento de “Detalhes” e “região próxima”",p:"Nas despesas de alimentação:",ol:["Acesse “Detalhes” na linha correspondente.","Selecione a opção relacionada a “região próxima”."],p2:"O procedimento visual detalhado será complementado após a validação prática no EBS."},
  {t:"5.3 Reembolso de combustível",p:"O reembolso de combustível é feito por meio de reembolso de quilometragem. A forma de preenchimento e a opção específica a selecionar no EBS serão detalhadas após a validação prática."},

  {t:"7. Anexar os documentos",ol:["Na última etapa do relatório, anexe todos os documentos disponibilizados no protocolo do Facilita.","Confira se os arquivos necessários foram anexados."],p2:"Não há regra específica para o nome dos arquivos nem para a ordem de anexação."},
  {t:"8. Submeter o relatório para aprovação",ol:["Após preencher o relatório e anexar os documentos, submeta-o para aprovação no EBS.","Aguarde a tela de confirmação.","Localize e copie o número do relatório gerado."],al:"Submeter o relatório não significa que ele já foi aprovado. A aprovação ocorre depois, no fluxo correspondente."},
  {t:"9. Concluir o atendimento no Facilita",ol:["Retorne ao protocolo de Reembolso de Despesa no Facilita.","Insira somente o número do relatório na observação do protocolo.","Clique em “Concluir atendimento”."],p2:"Com essa ação, termina a atividade do aprendiz no protocolo. Não é preciso aguardar a aprovação do relatório para concluir o atendimento."},
  {t:"10. Acompanhar o resultado da aprovação",p:"Após a submissão, o workflow envia um e-mail com o resultado do relatório.",ul:[["Aprovado","não é necessário realizar outra etapa no protocolo já concluído"],["Rejeitado","o e-mail informa o motivo; corrija o relatório diretamente no EBS, salve e submeta novamente para aprovação"]],p2:"Mesmo se a rejeição ocorrer depois da conclusão do protocolo no Facilita, não é necessário atualizar esse protocolo."},

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cats(){
 var c=["Todas"];ITENS.forEach(function(i){if(c.indexOf(i.cat)<0)c.push(i.cat)});

 var n=ITENS.filter(function(i){return done[i.id]}).length;

 var h='<article class="item '+(isIt?"it":"")+(done[i.id]?" done":"")+(open?" open":"")+'" data-id="'+i.id+'"><div class="row"><div class="main">'
  +'<span class="kind">'+(isIt?"IT":"Vídeo")+'</span><span class="meta">'+esc(i.cat)+" · "+esc(isIt?i.rev:i.dur)+'</span>'
  +'<h2>'+esc(isIt&&i.codigo?i.codigo+" · "+i.titulo:i.titulo)+'</h2><div class="meta">'+esc(isIt?i.objetivo:i.desc)+'</div></div><div class="act">';
 if(isIt)h+='<button class="btn ghost" data-a="toggle" aria-expanded="'+open+'">'+(open?"Fechar IT":"Ler IT")+'</button>';
 else h+=i.url?'<a class="btn" href="'+esc(i.url)+'" target="_blank" rel="noopener">Assistir</a>':'<span class="btn" aria-disabled="true">Link em breve</span>';
 h+='<label class="chk"><input type="checkbox" data-a="done"'+(done[i.id]?" checked":"")+'> Concluído</label></div></div>';
 if(isIt)h+=det(i);
 return h+'</article>';
}
function det(i){
 var h='<div class="detail">';
 i.secoes.forEach(function(x){
  h+='<h3>'+esc(x.t)+'</h3>';
  if(x.p)h+='<p>'+esc(x.p)+'</p>';
  ["ol","ul"].forEach(function(k){if(x[k])h+='<'+k+'>'+x[k].map(function(y){return '<li>'+(Array.isArray(y)?'<b>'+esc(y[0])+':</b> '+esc(y[1]):esc(y))+'</li>'}).join('')+'</'+k+'>'});
  if(x.chk)h+='<div class="chkl">'+x.chk.map(function(y,n){var k=i.id+"_"+n;return '<label class="chk"><input type="checkbox" data-a="c" data-k="'+k+'"'+(done[k]?' checked':'')+'> '+esc(y)+'</label>'}).join('')+'</div>';
  if(x.al)h+='<div class="alert">'+esc(x.al)+'</div>';
  if(x.p2)h+='<p>'+esc(x.p2)+'</p>';
 });
 return h+'</div>';
}
function render(){
 var q=st.q.toLowerCase();
 var l=ITENS.filter(function(i){
  return (st.k==="all"||i.tipo===st.k)&&(st.cat==="Todas"||i.cat===st.cat)&&(!q||(i.titulo+" "+(i.codigo||"")+" "+(i.desc||i.objetivo)).toLowerCase().indexOf(q)>=0);
 });
 document.getElementById("list").innerHTML=l.length?l.map(card).join(""):'<div class="empty">Nada encontrado. Limpe a busca ou escolha outra categoria.</div>';
 prog();
}
document.getElementById("tabs").addEventListener("click",function(e){
 var b=e.target.closest("[data-k]");if(!b)return;st.k=b.dataset.k;
 document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-pressed",t===b)});render();
});
document.getElementById("cats").addEventListener("click",function(e){
 var b=e.target.closest("[data-c]");if(!b)return;st.cat=b.dataset.c;cats();render();
});
document.getElementById("q").addEventListener("input",function(e){st.q=e.target.value;render()});
document.getElementById("list").addEventListener("click",function(e){
 var el=e.target.closest("[data-a]");if(!el)return;
 var id=el.closest(".item").dataset.id;
 if(el.dataset.a==="toggle"){st.open=st.open===id?null:id;render()}
 else if(el.dataset.a==="c"){if(el.checked)done[el.dataset.k]=1;else delete done[el.dataset.k];save()}
 else if(el.dataset.a==="done"){if(el.checked)done[id]=1;else delete done[id];save();render()}
});
var MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var hoje=new Date();hoje.setHours(0,0,0,0);
var ev=EVENTOS.map(function(x){return{d:new Date(x.data+"T12:00:00"),t:x.titulo,h:x.hora,l:x.local}}).filter(function(x){return x.d>=hoje}).sort(function(a,b){return a.d-b.d});
document.getElementById("s-eventos").innerHTML='<div class="list">'+(ev.length?ev.map(function(x){return '<div class="ev"><div class="d">'+x.d.getDate()+'<small>'+MES[x.d.getMonth()]+'</small></div><div><b>'+esc(x.t)+'</b><div class="meta">'+esc(x.h)+(x.l?' · '+esc(x.l):'')+'</div></div></div>'}).join(''):'<div class="empty">Nenhum evento marcado por enquanto.</div>')+'</div>';
document.getElementById("s-faq").innerHTML='<div class="list">'+FAQ.map(function(q){return '<details><summary>'+esc(q.p)+'</summary><p>'+esc(q.r)+'</p></details>'}).join('')+'</div>';
document.getElementById("nav").addEventListener("click",function(e){
 var b=e.target.closest("[data-s]");if(!b)return;
 ["trein","eventos","faq"].forEach(function(k){document.getElementById("s-"+k).hidden=(k!==b.dataset.s)});
 document.querySelectorAll("#nav button").forEach(function(x){x.setAttribute("aria-current",x===b)});
});
if(ITENS.length<4){document.querySelector('.tools').hidden=true;document.getElementById('cats').hidden=true}
if(ITENS.length===1)st.open=ITENS[0].id;
cats();render();
</script>
</body>
</html>
